<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MITO & TicketSir — Sprint 31 Project Gantt Chart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181a20;
    --surface2: #1e2028;
    --border: #2a2d37;
    --text: #e4e4e7;
    --text-dim: #9ca3af;
    --text-muted: #6b7280;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,.18);
    --complete: #22c55e;
    --in-progress: #f59e0b;
    --not-started: #ef4444;
    --today: #f43f5e;
    --header-bg: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  .page-header {
    background: var(--header-bg);
    border-bottom: 1px solid rgba(99,102,241,.25);
    padding: 28px 40px;
    position: sticky; top:0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .page-header h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -.3px;
    background: linear-gradient(90deg,#c7d2fe,#818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .page-header .sub {
    font-size: 13px; color: var(--text-dim); margin-top: 4px;
  }
  .header-row { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }

  /* ─── KPI STRIP ─── */
  .kpi-strip {
    display:flex; gap:16px; padding:18px 40px; background:var(--surface); border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .kpi {
    flex:0 0 auto; min-width:150px;
    background: var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:14px 18px; text-align:center;
  }
  .kpi .val { font-size:26px; font-weight:700; }
  .kpi .lbl { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.8px; margin-top:2px; }
  .kpi.green .val { color: var(--complete); }
  .kpi.amber .val { color: var(--in-progress); }
  .kpi.red   .val { color: var(--not-started); }
  .kpi.blue  .val { color: var(--accent); }

  /* ─── FILTERS ─── */
  .filters {
    display:flex; gap:10px; padding:14px 40px; background:var(--surface); border-bottom:1px solid var(--border);
    flex-wrap:wrap; align-items:center;
  }
  .filters label { font-size:12px; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.6px; }
  .filters select, .filters input[type=text] {
    background:var(--surface2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); padding:6px 12px; font-size:13px; font-family:inherit;
    outline:none; transition: border-color .2s;
  }
  .filters select:focus, .filters input:focus { border-color: var(--accent); }
  .chip-group { display:flex; gap:6px; flex-wrap:wrap; }
  .chip {
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 12px; border-radius:20px; font-size:12px; font-weight:500;
    cursor:pointer; border:1px solid var(--border); background:var(--surface2);
    transition: all .2s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip .dot { width:8px; height:8px; border-radius:50%; }

  /* ─── LEGEND ─── */
  .legend {
    display:flex; gap:18px; padding:10px 40px 10px; flex-wrap:wrap; align-items:center;
  }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); }
  .legend-swatch { width:14px; height:14px; border-radius:3px; }
  .legend-toggle {
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
    cursor:pointer; user-select:none;
    padding:4px 10px; border-radius:6px;
    border:1px solid transparent;
    transition: all .2s;
  }
  .legend-toggle:hover { border-color:var(--accent); color:var(--text); }
  .legend-toggle.active { border-color:var(--accent); background:var(--accent-glow); color:var(--text); }
  .legend-toggle .lt-check {
    width:14px; height:14px; border-radius:3px;
    border:2px solid #6366f1;
    background:rgba(99,102,241,.25);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#fff; transition: background .2s;
  }
  .legend-toggle.active .lt-check { background:#6366f1; }

  /* ─── CUSTOM SCROLLBAR ─── */
  * {
    scrollbar-width: thin;
    scrollbar-color: #4f46e5 var(--surface2);
  }
  ::-webkit-scrollbar {
    width: 10px;
    height: 12px;
  }
  ::-webkit-scrollbar-track {
    background: var(--surface2);
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    border-radius: 6px;
    border: 2px solid var(--surface2);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(135deg, #6366f1, #818cf8);
  }
  ::-webkit-scrollbar-corner {
    background: var(--surface2);
  }

  /* ─── GANTT CONTAINER ─── */
  .gantt-wrapper {
    padding: 0 40px 40px;
    overflow-x: auto;
    overflow-y: visible;
  }
  .gantt-table {
    width: 100%;
    min-width: 1200px;
    border-collapse: separate;
    border-spacing: 0;
  }

  /* TABLE HEADER */
  .gantt-table thead th {
    position: sticky; top: 90px; z-index: 10;
    background: var(--surface);
    padding: 10px 12px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px;
    color: var(--text-dim);
    border-bottom: 2px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  .gantt-table thead th.timeline-header {
    text-align: center;
  }

  /* TABLE ROWS */
  .gantt-table tbody tr {
    transition: background .15s;
  }
  .gantt-table tbody tr:hover {
    background: rgba(99,102,241,.06);
  }
  .gantt-table tbody tr.summary-row {
    background: rgba(99,102,241,.05);
  }
  .gantt-table tbody tr.summary-row:hover {
    background: rgba(99,102,241,.1);
  }
  .gantt-table tbody tr.hidden { display:none; }

  .gantt-table td {
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    white-space: nowrap;
  }

  /* TASK NAME */
  .task-name {
    display:flex; align-items:center; gap:6px;
    max-width: 320px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-name .indent { flex-shrink:0; }
  .task-name .icon { font-size:14px; flex-shrink:0; }
  .task-name .label {
    overflow:hidden; text-overflow:ellipsis;
  }
  .summary-row .task-name .label { font-weight:600; color:#a5b4fc; }

  /* Epic breadcrumb tag on child rows */
  .epic-tag {
    display:none;
    font-size:9px; font-weight:600; letter-spacing:.4px;
    color:#818cf8; background:rgba(99,102,241,.12);
    border:1px solid rgba(99,102,241,.2);
    border-radius:4px; padding:1px 6px;
    white-space:nowrap; max-width:150px;
    overflow:hidden; text-overflow:ellipsis;
    flex-shrink:0; margin-left:4px;
  }
  .show-epic-tags .epic-tag { display:inline-block; }

  /* STATUS BADGE */
  .status-badge {
    display:inline-flex; align-items:center; gap:4px;
    padding: 3px 10px; border-radius:20px; font-size:11px; font-weight:600;
    letter-spacing: .3px;
  }
  .status-badge.completed { background:rgba(34,197,94,.12); color:#4ade80; }
  .status-badge.in-progress { background:rgba(245,158,11,.12); color:#fbbf24; }
  .status-badge.not-started { background:rgba(239,68,68,.12); color:#f87171; }

  /* RESOURCE */
  .resource-tag {
    display:inline-flex; align-items:center; gap:5px;
    padding: 3px 10px; border-radius:20px; font-size:11px; font-weight:500;
    border: 1px solid;
  }
  .resource-tag .avatar {
    width:18px; height:18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:700; color:#fff;
  }

  /* PROGRESS CELL */
  .progress-cell { display:flex; align-items:center; gap:8px; }
  .progress-bar-bg {
    width:70px; height:6px; background:var(--border); border-radius:3px; overflow:hidden;
  }
  .progress-bar-fill {
    height:100%; border-radius:3px; transition: width .4s;
  }
  .progress-pct { font-size:12px; font-weight:600; min-width:34px; text-align:right; }

  /* TIMELINE BAR CELL */
  .timeline-cell {
    padding: 8px 4px !important;
    min-width: 520px;
  }
  .timeline-container {
    position: relative;
    height: 26px;
    width: 100%;
  }
  .tl-bar {
    position: absolute;
    height: 20px;
    top: 3px;
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: filter .2s, transform .15s;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .tl-bar:hover {
    filter: brightness(1.2);
    transform: scaleY(1.2);
    z-index: 5;
  }
  .tl-bar .tl-progress {
    height: 100%;
    opacity: .55;
    border-radius: 4px 0 0 4px;
  }
  .tl-bar .tl-label {
    position: absolute; top:0; left:0; right:0; bottom:0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
    pointer-events: none;
  }

  /* TODAY LINE */
  .today-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--today);
    z-index: 4;
    pointer-events: none;
  }
  .today-line::before {
    content: 'TODAY';
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    font-size: 8px; font-weight: 700; color: var(--today);
    letter-spacing: .5px;
    white-space: nowrap;
  }

  /* MONTH GRID */
  .month-grid {
    position: absolute; top:0; bottom:0; left:0; right:0;
    pointer-events: none;
  }
  .month-line {
    position: absolute; top:0; bottom:0;
    border-left: 1px dashed rgba(255,255,255,.06);
  }

  /* DATES */
  .date-range { font-size:11px; color:var(--text-muted); }

  /* TOOLTIP */
  .tooltip-box {
    display:none;
    position:fixed; z-index:1000;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    max-width: 320px;
    pointer-events: none;
  }
  .tooltip-box.visible { display:block; }
  .tooltip-box .tt-title { font-weight:700; font-size:14px; margin-bottom:6px; color:#c7d2fe; }
  .tooltip-box .tt-row { display:flex; justify-content:space-between; gap:16px; padding:2px 0; }
  .tooltip-box .tt-label { color:var(--text-dim); }
  .tooltip-box .tt-val { font-weight:600; }

  /* RESPONSIVE */
  @media (max-width:768px) {
    .page-header, .kpi-strip, .filters, .legend, .gantt-wrapper { padding-left:16px; padding-right:16px; }
  }

  /* ─── FLOATING SCROLLBAR ─── */
  .floating-scrollbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 90;
    height: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 12px rgba(0,0,0,.3);
    transition: opacity .25s;
  }
  .floating-scrollbar.fs-hidden {
    opacity: 0;
    pointer-events: none;
  }
  .floating-scrollbar-inner {
    height: 1px; /* just enough to create the scrollbar */
  }

  /* PRINT */
  @media print {
    body { background:#fff; color:#111; }
    .page-header { background:#4338ca !important; }
    .page-header h1 { -webkit-text-fill-color:#fff; }
    .filters { display:none; }
    .gantt-table thead th { background:#f3f4f6; color:#374151; }
    .gantt-table tbody tr.summary-row { background:#eef2ff; }
    .gantt-wrapper { overflow:visible; }
  }
</style>
</head>

// ─── RESOURCE COLORS ───
const resourceColors = {
  'Rishabh':  { bg:'#3b82f6', border:'#60a5fa' },
  'Jayant':   { bg:'#8b5cf6', border:'#a78bfa' },
  'Monu':     { bg:'#06b6d4', border:'#22d3ee' },
  'Vakil':    { bg:'#f97316', border:'#fb923c' },
  'Sakshi':   { bg:'#ec4899', border:'#f472b6' },
  'Robin':    { bg:'#10b981', border:'#34d399' },
  'Iyanu':    { bg:'#eab308', border:'#facc15' },
};
const defaultColor = { bg:'#6366f1', border:'#818cf8' };

function getColor(name) { return resourceColors[name] || defaultColor; }

// ─── TIMELINE RANGE ───
const TL_START = new Date('2025-11-01');
const TL_END   = new Date('2026-05-10');
const TL_RANGE = TL_END - TL_START;
const TODAY    = new Date('2026-04-07');

function datePct(d) {
  const dt = new Date(d);
  return Math.max(0, Math.min(100, ((dt - TL_START) / TL_RANGE) * 100));
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear();
}

function statusOf(pct) {
  if (pct >= 100) return 'completed';
  if (pct > 0)    return 'in-progress';
  return 'not-started';
}
function statusLabel(s) {
  if (s === 'completed')   return 'Completed';
  if (s === 'in-progress') return 'In Progress';
  return 'Not Started';
}
function statusIcon(s) {
  if (s === 'completed')   return '✓';
  if (s === 'in-progress') return '◐';
  return '○';
}

// ─── KPIs ───
function renderKPIs() {
  const leafTasks = tasks.filter(t => !t.summary && t.outline_level > 0);
  const total = leafTasks.length;
  const done  = leafTasks.filter(t => t.percent_complete >= 100).length;
  const inProg = leafTasks.filter(t => t.percent_complete > 0 && t.percent_complete < 100).length;
  const notStarted = leafTasks.filter(t => t.percent_complete === 0).length;
  const avgPct = Math.round(leafTasks.reduce((s,t) => s + t.percent_complete, 0) / total);
  const uniqueRes = [...new Set(tasks.flatMap(t => t.resources))].filter(Boolean);

  document.getElementById('kpiStrip').innerHTML = `
    <div class="kpi blue"><div class="val">${total}</div><div class="lbl">Total Tasks</div></div>
    <div class="kpi green"><div class="val">${done}</div><div class="lbl">Completed</div></div>
    <div class="kpi amber"><div class="val">${inProg}</div><div class="lbl">In Progress</div></div>
    <div class="kpi red"><div class="val">${notStarted}</div><div class="lbl">Not Started</div></div>
    <div class="kpi blue"><div class="val">${avgPct}%</div><div class="lbl">Avg Progress</div></div>
    <div class="kpi blue"><div class="val">${uniqueRes.length}</div><div class="lbl">Team Members</div></div>
  `;
}

// ─── RESOURCE CHIPS ───
let activeResource = 'all';
let showSummaryRows = true;
function renderChips() {
  const allRes = [...new Set(tasks.flatMap(t => t.resources))].filter(Boolean).sort();
  const container = document.getElementById('resourceChips');
  let html = `<div class="chip active" data-res="all">All</div>`;
  allRes.forEach(r => {
    const c = getColor(r);
    html += `<div class="chip" data-res="${r}"><span class="dot" style="background:${c.bg};"></span>${r}</div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeResource = chip.dataset.res;
      applyFilters();
    });
  });
}

// ─── MONTH LINES ───
function monthLines() {
  let html = '';
  let d = new Date(TL_START);
  d.setDate(1);
  d.setMonth(d.getMonth() + 1);
  while (d < TL_END) {
    const pct = datePct(d);
    html += `<div class="month-line" style="left:${pct}%;"></div>`;
    d.setMonth(d.getMonth() + 1);
  }
  return html;
}

// ─── RENDER ROWS ───
function renderGantt() {
  const tbody = document.getElementById('ganttBody');
  let html = '';
  const monthLinesHtml = monthLines();
  const todayPct = datePct(TODAY);

  // Skip the project-level summary (outline_level 0)
  const displayTasks = tasks.filter(t => t.outline_level > 0);

  displayTasks.forEach(t => {
    const status = statusOf(t.percent_complete);
    const indent = (t.outline_level - 1) * 20;
    const isSummary = t.summary;
    const res = t.resources.join(', ') || '—';
    const resColor = t.resources.length ? getColor(t.resources[0]) : defaultColor;

    // Timeline bar
    const startPct = datePct(t.start);
    let endPct = datePct(t.finish);
    let barWidth = Math.max(endPct - startPct, 0.5); // min visual width

    // Color
    let barColor, progressColor;
    if (isSummary) {
      barColor = 'rgba(99,102,241,.35)';
      progressColor = 'rgba(99,102,241,.6)';
    } else if (status === 'completed') {
      barColor = 'rgba(34,197,94,.3)';
      progressColor = '#22c55e';
    } else if (status === 'not-started') {
      barColor = 'rgba(239,68,68,.25)';
      progressColor = '#ef4444';
    } else {
      barColor = resColor.bg + '40';
      progressColor = resColor.bg;
    }

    // Resource tag
    let resourceHtml = '—';
    if (t.resources.length) {
      const rc = getColor(t.resources[0]);
      const initials = t.resources[0].slice(0,2).toUpperCase();
      resourceHtml = `<span class="resource-tag" style="border-color:${rc.border}30; color:${rc.border};">
        <span class="avatar" style="background:${rc.bg};">${initials}</span>${t.resources[0]}
      </span>`;
    }

    // Find the nearest ancestor at outline_level 1 (the epic/feature)
    let epicName = '';
    if (t.outline_level > 1 && t.parent_id !== null) {
      // Walk up to find the level-1 ancestor
      let parentId = t.parent_id;
      let safety = 10;
      while (parentId !== null && safety-- > 0) {
        const parent = tasks.find(p => p.unique_id === parentId);
        if (!parent) break;
        if (parent.outline_level === 1) { epicName = parent.name; break; }
        parentId = parent.parent_id;
      }
    }

    html += `<tr class="${isSummary ? 'summary-row' : ''}" data-status="${status}" data-resources="${t.resources.join(',')}" data-name="${t.name.toLowerCase()}" data-unique-id="${t.unique_id || ''}" data-parent-id="${t.parent_id || ''}" data-outline-level="${t.outline_level}" data-is-summary="${isSummary}" data-epic="${epicName}">
      <td>
        <div class="task-name">
          <span class="indent" style="width:${indent}px;"></span>
          <span class="icon">${isSummary ? '📁' : (t.milestone ? '◆' : '▸')}</span>
          <span class="label" title="${t.name}">${t.name}</span>
          ${epicName ? `<span class="epic-tag" title="${epicName}">${epicName}</span>` : ''}
        </div>
      </td>
      <td>${resourceHtml}</td>
      <td><span class="status-badge ${status}">${statusIcon(status)} ${statusLabel(status)}</span></td>
      <td>
        <div class="progress-cell">
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${t.percent_complete}%; background:${status === 'completed' ? '#22c55e' : status === 'not-started' ? '#ef4444' : resColor.bg};"></div></div>
          <span class="progress-pct" style="color:${status === 'completed' ? '#4ade80' : status === 'not-started' ? '#f87171' : resColor.border};">${t.percent_complete}%</span>
        </div>
      </td>
      <td><span class="date-range">${fmtDate(t.start)} – ${fmtDate(t.finish)}</span></td>
      <td class="timeline-cell">
        <div class="timeline-container"
             data-task-name="${t.name}"
             data-task-epic="${epicName}"
             data-task-start="${fmtDate(t.start)}"
             data-task-finish="${fmtDate(t.finish)}"
             data-task-pct="${t.percent_complete}"
             data-task-res="${res}"
             data-task-status="${statusLabel(status)}">
          ${monthLinesHtml}
          <div class="today-line" style="left:${todayPct}%;"></div>
          <div class="tl-bar" style="left:${startPct}%; width:${barWidth}%; background:${barColor};">
            <div class="tl-progress" style="width:${t.percent_complete}%; background:${progressColor};"></div>
            ${barWidth > 4 ? `<span class="tl-label">${t.percent_complete}%</span>` : ''}
          </div>
        </div>
      </td>
    </tr>`;
  });

  tbody.innerHTML = html;
  attachTooltips();
}

// ─── TOOLTIPS ───
function attachTooltips() {
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.timeline-container').forEach(el => {
    el.addEventListener('mouseenter', e => {
      const d = el.dataset;
      const epicRow = d.taskEpic ? `<div class="tt-row"><span class="tt-label">Feature / Epic</span><span class="tt-val" style="color:#a5b4fc;">${d.taskEpic}</span></div>` : '';
      tooltip.innerHTML = `
        <div class="tt-title">${d.taskName}</div>
        ${epicRow}
        <div class="tt-row"><span class="tt-label">Owner</span><span class="tt-val">${d.taskRes}</span></div>
        <div class="tt-row"><span class="tt-label">Status</span><span class="tt-val">${d.taskStatus}</span></div>
        <div class="tt-row"><span class="tt-label">Progress</span><span class="tt-val">${d.taskPct}%</span></div>
        <div class="tt-row"><span class="tt-label">Start</span><span class="tt-val">${d.taskStart}</span></div>
        <div class="tt-row"><span class="tt-label">Finish</span><span class="tt-val">${d.taskFinish}</span></div>
      `;
      tooltip.classList.add('visible');
    });
    el.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => {
      tooltip.classList.remove('visible');
    });
  });
}

// ─── FILTERING ───
function applyFilters() {
  const statusVal = document.getElementById('statusFilter').value;
  const searchVal = document.getElementById('searchBox').value.toLowerCase();
  const isFiltering = statusVal !== 'all' || activeResource !== 'all' || searchVal.length > 0;

  const allRows = [...document.querySelectorAll('#ganttBody tr')];

  // Step 1: Determine which rows match the filter directly
  const matchMap = new Map(); // uniqueId -> boolean
  const parentIdsToShow = new Set(); // unique_ids of parents we must force-show

  allRows.forEach(row => {
    const rStatus = row.dataset.status;
    const rRes    = row.dataset.resources;
    const rName   = row.dataset.name;
    const isSummary = row.dataset.isSummary === 'true';
    const uniqueId = row.dataset.uniqueId;

    let directMatch = true;

    if (isSummary) {
      // Summary rows don't directly match filters — they are shown
      // only if at least one child matches (handled in step 2)
      directMatch = false;
    } else {
      if (statusVal !== 'all' && rStatus !== statusVal) directMatch = false;
      if (activeResource !== 'all' && !rRes.includes(activeResource)) directMatch = false;
      if (searchVal && !rName.includes(searchVal)) directMatch = false;
    }

    matchMap.set(uniqueId, directMatch);
  });

  // Step 2: For every matching leaf/child row, walk up parent chain
  // and mark all ancestors to be shown
  allRows.forEach(row => {
    const uniqueId = row.dataset.uniqueId;
    if (!matchMap.get(uniqueId)) return;

    // Walk up the parent chain via the tasks data
    let parentId = row.dataset.parentId;
    let safety = 10;
    while (parentId && safety-- > 0) {
      parentIdsToShow.add(parentId);
      const parentTask = tasks.find(t => String(t.unique_id) === parentId);
      if (!parentTask) break;
      parentId = parentTask.parent_id ? String(parentTask.parent_id) : null;
    }
  });

  // Step 3: Apply visibility
  allRows.forEach(row => {
    const uniqueId = row.dataset.uniqueId;
    const isSummary = row.dataset.isSummary === 'true';

    let show;
    if (!isFiltering) {
      show = true; // No filters active — show everything
    } else if (isSummary) {
      // Show summary row if any child matched (it's in parentIdsToShow)
      show = parentIdsToShow.has(uniqueId);
    } else {
      show = matchMap.get(uniqueId);
    }

    // If summary rows are toggled off, hide them
    if (isSummary && !showSummaryRows) {
      show = false;
    }

    row.classList.toggle('hidden', !show);
  });

  // Step 4: Toggle epic breadcrumb tags visibility when filtering or when summary rows hidden
  document.getElementById('ganttBody').classList.toggle('show-epic-tags', isFiltering || !showSummaryRows);
}

document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('searchBox').addEventListener('input', applyFilters);

// ─── SUMMARY TOGGLE ───
document.getElementById('toggleSummary').addEventListener('click', function() {
  showSummaryRows = !showSummaryRows;
  this.classList.toggle('active', showSummaryRows);
  this.querySelector('.lt-check').textContent = showSummaryRows ? '✓' : '';
  applyFilters();
});

// ─── FLOATING SCROLLBAR SYNC ───
function initFloatingScrollbar() {
  const wrapper = document.querySelector('.gantt-wrapper');
  const floatBar = document.getElementById('floatingScrollbar');
  const floatInner = document.getElementById('floatingScrollbarInner');
  let syncing = false;

  function updateSize() {
    // Match the inner width to the gantt table's scroll width
    // and the floating scrollbar's visible width to the wrapper's client width
    floatBar.style.left = wrapper.getBoundingClientRect().left + 'px';
    floatBar.style.right = (document.documentElement.clientWidth - wrapper.getBoundingClientRect().right) + 'px';
    floatInner.style.width = wrapper.scrollWidth + 'px';
  }

  function updateVisibility() {
    // Hide the floating bar if the real scrollbar is already visible in the viewport
    const wrapperRect = wrapper.getBoundingClientRect();
    const viewportH = window.innerHeight;
    // The real scrollbar is at the bottom edge of the wrapper
    const realScrollbarY = wrapperRect.bottom;
    // If the real scrollbar is visible (within viewport), hide the floating one
    const realBarVisible = realScrollbarY <= viewportH + 5 && realScrollbarY >= 0;
    // Also hide if wrapper top is below viewport (not scrolled to it yet)
    const wrapperAboveViewport = wrapperRect.top > viewportH;
    // Also hide if there's no horizontal overflow
    const hasOverflow = wrapper.scrollWidth > wrapper.clientWidth + 2;

    if (realBarVisible || wrapperAboveViewport || !hasOverflow) {
      floatBar.classList.add('fs-hidden');
    } else {
      floatBar.classList.remove('fs-hidden');
    }
  }

  // Sync scroll positions bidirectionally
  wrapper.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    floatBar.scrollLeft = wrapper.scrollLeft;
    syncing = false;
  });

  floatBar.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    wrapper.scrollLeft = floatBar.scrollLeft;
    syncing = false;
  });

  // Update on scroll, resize, and initially
  window.addEventListener('scroll', updateVisibility, { passive: true });
  window.addEventListener('resize', () => { updateSize(); updateVisibility(); });

  // Initialize
  updateSize();
  updateVisibility();

  // Re-check after layout settles
  requestAnimationFrame(() => { updateSize(); updateVisibility(); });
}

// ─── INIT ───
renderKPIs();
renderChips();
renderGantt();
initFloatingScrollbar();
